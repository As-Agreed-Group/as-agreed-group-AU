---
layout: default
---
<section class="post-article">
  <div class="wrap">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a>
    <div class="eyebrow">{{ page.date | date: "%d %b %Y" }}</div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-sub">{{ page.description }}</p>{% endif %}
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <h2>Get in touch</h2>
    <p class="sub">Tell us what needs covering. We'll scope it, price it, and put it in writing.</p>
    <a class="btn-primary" href="mailto:info@asagreed.au">info@asagreed.au</a>
  </div>
</section>
