title: As Agreed Group
description: >-
  Bookkeeping, payroll, IT support and administration for growing businesses
  on the Gold Coast. Fixed scope, fixed monthly price.
url: "https://www.asagreed.au"
baseurl: ""
lang: en-AU

author: As Agreed Group
email: info@asagreed.au

markdown: kramdown
kramdown:
  input: GFM

timezone: Australia/Brisbane
future: true

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTES.md
  - node_modules
  - vendor
